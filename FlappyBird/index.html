<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird ULTIMATE 🐦</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Poppins', sans-serif; overflow: hidden;
            transition: background 0.5s ease;
        }
        body.night { background: linear-gradient(135deg, #0a0a15 0%, #1a1a2e 50%, #0a0a15 100%); }
        .game-container {
            position: relative; border-radius: 20px; overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 100px rgba(102, 126, 234, 0.3);
            animation: fadeIn 0.6s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        canvas { display: block; border-radius: 20px; cursor: pointer; max-height: 95vh; max-width: 95vw; }
        .loading {
            position: absolute; inset: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; z-index: 100; transition: opacity 0.5s ease;
        }
        .loading.hide { opacity: 0; pointer-events: none; }
        .loading-title {
            font-family: 'Press Start 2P', cursive; font-size: 24px; margin-bottom: 30px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.3); animation: bounce 1s ease infinite;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .loading-bar { width: 200px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; }
        .loading-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd700, #ffed4e); border-radius: 10px; animation: load 2s ease forwards; }
        @keyframes load { to { width: 100%; } }
        .loading-text { margin-top: 15px; font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="loading" id="loading">
            <div class="loading-title">FLAPPY ULTIMATE</div>
            <div class="loading-bar"><div class="loading-bar-fill"></div></div>
            <div class="loading-text">Loading...</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
